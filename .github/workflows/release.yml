name: Prepare release draft

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/ci.yml
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: QuietSpeak-*
          path: release-files
          merge-multiple: true
      - name: Create release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 Scripts/check-version.py --tag "$RELEASE_TAG"
          cat release-files/SHA256SUMS-*.txt > release-files/SHA256SUMS.txt
          (cd release-files && sha256sum --check SHA256SUMS.txt)
          rm release-files/SHA256SUMS-arm64.txt release-files/SHA256SUMS-x86_64.txt
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release already exists for $RELEASE_TAG; refusing to create a duplicate." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-files/* \
            --draft --verify-tag --title "QuietSpeak $RELEASE_TAG" \
            --notes-file Docs/RELEASE_NOTES.md

