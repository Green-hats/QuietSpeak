name: Bug report / 问题反馈
description: Report a reproducible issue / 提交可复现的问题
body:
  - type: input
    id: version
    attributes:
      label: App version / App 版本
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS version and CPU / macOS 版本和 CPU
      placeholder: macOS 15.7, Apple M2
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and expected result / 复现步骤及预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result / 实际结果
      description: Remove passwords, identities and private server details from logs and screenshots.
    validations:
      required: true
  - type: textarea
    id: audio
    attributes:
      label: Audio details, if relevant / 音频问题的补充信息
      description: Output device, speaker test result, codec, mute state, and whether another client can hear you.
