[package]
name = "quietspeak-core"
version = "0.1.8"
edition = "2021"
license = "MIT"
description = "Native macOS TeamSpeak 3 client protocol and audio bridge"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
anyhow = "1"
audiopus = "0.3.0-rc.0"
cpal = "0.18"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net"] }
tsclientlib = { path = "../Vendor/tsclientlib/tsclientlib", default-features = false, features = ["audio", "default-tls"] }
tsproto-packets = { path = "../Vendor/tsclientlib/utils/tsproto-packets" }

[profile.release]
opt-level = 2
strip = "debuginfo"

[patch.crates-io]
audiopus_sys = { path = "../Vendor/audiopus_sys" }
